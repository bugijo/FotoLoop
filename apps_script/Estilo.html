<style>
@import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Montserrat:wght@600;700;800&display=swap');

/* Paleta tirada da arte da festa: preto, pink neon e branco. */
:root {
  --fundo: #070203;
  --rosa: #ff1f8f;
  --rosa-neon: #ff4fae;
  --rosa-claro: #ffb3da;
  --branco: #ffffff;
  --texto: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --roteiro: 'Kaushan Script', 'Segoe Script', cursive;
  --brilho: 0 0 0 1px rgba(255,79,174,.55), 0 0 10px rgba(255,31,143,.9), 0 0 26px rgba(255,31,143,.45);
}

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; overflow-x: hidden; }

body {
  min-height: 100vh;
  font-family: var(--texto);
  color: var(--branco);
  background: var(--fundo);
  -webkit-text-size-adjust: 100%;
}
