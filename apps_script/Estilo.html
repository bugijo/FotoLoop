<style>
@import url('https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Permanent+Marker&display=swap');

:root {
  --rosa: #ff1f8e;
  --rosa-claro: #ff8fc7;
  --rosa-escuro: #b0126a;
  --preto: #0a0a0a;
  --branco: #ffffff;
  --fonte-marcador: 'Permanent Marker', 'Impact', system-ui, sans-serif;
  --fonte-roteiro: 'Kaushan Script', 'Segoe Script', cursive;
  --fonte-texto: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  font-family: var(--fonte-texto);
  color: var(--branco);
  background-color: var(--preto);
  background-image:
    radial-gradient(circle at 85% 8%, rgba(255,31,142,.38), transparent 42%),
    radial-gradient(circle at 8% 92%, rgba(255,31,142,.28), transparent 45%);
}

/* Moldura rosa com brilho neon. inset não muda o layout. */
.cartao {
  position: relative;
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  margin: 0 auto;
  padding: 22px 18px 34px;
  display: flex;
  flex-direction: column;
  gap: 18px;
  overflow: hidden;
  box-shadow:
    inset 0 0 0 8px var(--rosa),
    inset 0 0 36px rgba(255,31,142,.55);
}

section {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  align-items: stretch;
}

section[hidden] { display: none; }

/* Decorações de rock: só enfeite, fora do fluxo e sem toques. */
.deco {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  fill: none;
  stroke: var(--rosa);
  stroke-width: 1.6;
  filter: drop-shadow(0 0 6px var(--rosa));
}
.deco-raio { top: 14px; right: 16px; width: 34px; height: 46px; fill: var(--rosa); stroke: none; }
.deco-coracao { top: 26px; left: 14px; width: 34px; height: 34px; }
.deco-estrela-esq { top: 46%; left: 6px; width: 30px; height: 30px; }
.deco-estrela-dir { bottom: 26%; right: 10px; width: 34px; height: 34px; fill: var(--rosa); stroke: none; }
.deco-disco { bottom: 12px; right: 8px; width: 96px; height: 96px; fill: var(--rosa-claro); stroke: none; filter: drop-shadow(0 0 10px var(--rosa)); }

/* Capa: título e foto */
.capa {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  gap: 6px;
  align-items: center;
}

.titulo { display: flex; flex-direction: column; }

.coroa {
  width: 62px;
  height: 40px;
  margin: 0 0 -4px 6px;
  fill: none;
  stroke: var(--branco);
  stroke-width: 3;
  stroke-linejoin: round;
}

.nome,
.seis,
.rock,
.rosa-titulo {
  margin: 0;
  font-family: var(--fonte-marcador);
  font-weight: 400;
  line-height: .95;
}

.nome {
  font-size: clamp(2.2rem, 11vw, 3.4rem);
  color: var(--branco);
  text-shadow: 0 0 10px rgba(255,31,142,.9);
  transform: rotate(-4deg);
  transform-origin: left center;
}

.sobrenome {
  margin: -4px 0 0 18px;
  font-family: var(--fonte-roteiro);
  font-size: clamp(1.5rem, 6.5vw, 2.1rem);
  color: var(--branco);
}

.seis {
  margin-top: 8px;
  font-size: clamp(5rem, 26vw, 8rem);
  color: var(--rosa);
  text-shadow: 0 0 14px rgba(255,31,142,.95), 0 4px 0 var(--rosa-escuro);
  letter-spacing: .02em;
}

.anos {
  margin: -6px 0 0 6px;
  font-family: var(--fonte-marcador);
  font-size: clamp(1.4rem, 6vw, 1.9rem);
  color: var(--branco);
}

.rock {
  margin-top: 6px;
  font-size: clamp(2.2rem, 11vw, 3.4rem);
  color: var(--branco);
  text-shadow: 0 0 8px rgba(255,255,255,.4);
}

.rosa-titulo {
  padding-bottom: 6px;
  font-size: clamp(2.2rem, 11vw, 3.4rem);
  color: var(--rosa);
  text-shadow: 0 0 12px rgba(255,31,142,.9);
}

.foto { margin: 0; }

.foto img {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 28px;
  box-shadow: 0 0 0 4px var(--rosa), 0 0 28px rgba(255,31,142,.85);
}

/* Telefone pequeno: título e foto em coluna, centralizados */
@media (max-width: 479px) {
  .deco-disco,
  .deco-estrela-dir { display: none; }
  .capa { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .titulo { align-items: center; }
  .coroa { margin: 0 auto -4px; }
  .nome, .rock, .rosa-titulo { transform: none; }
  .sobrenome { margin: -4px 0 0; }
  .anos { margin-left: 0; }
  .foto { width: min(72vw, 290px); }
}

/* Convite em faixa rosa */
.convite {
  margin: 4px -4px 0;
  padding: 10px 14px 12px;
  background: var(--rosa);
  color: var(--branco);
  font-family: var(--fonte-roteiro);
  font-size: clamp(1.6rem, 7vw, 2.1rem);
  line-height: 1.1;
  text-align: center;
  transform: rotate(-1.5deg);
  border-radius: 6px 14px 8px 12px;
  box-shadow: 0 0 18px rgba(255,31,142,.7);
}

.subconvite {
  margin: 0;
  text-align: center;
  font-size: 1.05rem;
  font-weight: 600;
  line-height: 1.4;
}

/* Botões: elementos HTML reais, com ícone, divisor e texto que quebra linha sem cortar */
.botao {
  appearance: none;
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 96px;
  padding: 14px 20px;
  border: 3px solid var(--rosa);
  border-radius: 28px;
  background: rgba(10,10,10,.92);
  color: var(--branco);
  font-family: var(--fonte-texto);
  font-size: clamp(1.15rem, 5.2vw, 1.45rem);
  font-weight: 900;
  line-height: 1.15;
  letter-spacing: .02em;
  text-align: left;
  text-transform: uppercase;
  box-shadow:
    0 0 0 1px rgba(255,31,142,.3),
    0 0 18px rgba(255,31,142,.6),
    inset 0 0 14px rgba(255,31,142,.35);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.botao:active { transform: scale(.98); }
.botao:disabled { opacity: .55; cursor: wait; }

.botao .icone {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 48px;
  height: 48px;
}

.botao .icone svg {
  width: 44px;
  height: 44px;
  fill: none;
  stroke: var(--branco);
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.botao .divisor {
  flex: 0 0 2px;
  align-self: stretch;
  background: var(--rosa);
  box-shadow: 0 0 8px var(--rosa);
}

.botao .rotulo { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }

.botao.secundario {
  justify-content: center;
  text-align: center;
  background: var(--branco);
  color: var(--preto);
  border-color: var(--branco);
  box-shadow: 0 0 16px rgba(255,255,255,.35);
}

.ajuda {
  padding: 12px 16px;
  border: 2px solid var(--rosa-claro);
  border-radius: 18px;
  background: rgba(255,255,255,.06);
  font-size: 1rem;
  line-height: 1.45;
}

.ajuda summary {
  font-weight: 800;
  font-size: 1.05rem;
  cursor: pointer;
}

.ajuda ol { margin: 10px 0 0; padding-left: 20px; }
.ajuda li { margin-bottom: 8px; }
.ajuda strong { color: var(--rosa-claro); }

.aviso {
  margin: 0;
  text-align: center;
  font-size: .98rem;
  line-height: 1.45;
  color: var(--rosa-claro);
  font-weight: 600;
}

.rodape {
  position: relative;
  z-index: 1;
  margin: 8px 0 0;
  text-align: center;
  font-family: var(--fonte-roteiro);
  font-size: clamp(1.5rem, 6.5vw, 2rem);
  line-height: 1.2;
  color: var(--branco);
}

.rodape strong {
  font-family: var(--fonte-marcador);
  font-weight: 400;
  color: var(--rosa);
}

/* Telas de prévia, envio, sucesso e erro */
.titulo-tela {
  margin: 0;
  text-align: center;
  font-family: var(--fonte-marcador);
  font-size: clamp(1.6rem, 7vw, 2.1rem);
  line-height: 1.1;
  color: var(--branco);
  text-shadow: 0 0 12px rgba(255,31,142,.9);
}

.pequeno {
  margin: 0;
  text-align: center;
  font-size: 1.1rem;
  font-weight: 600;
  line-height: 1.4;
  color: var(--branco);
}

.moldura-previa {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 220px;
  padding: 10px;
  border: 4px solid var(--rosa);
  border-radius: 24px;
  background: rgba(10,10,10,.9);
  box-shadow: 0 0 22px rgba(255,31,142,.7);
}

.moldura-previa img {
  display: block;
  max-width: 100%;
  max-height: 55vh;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: 16px;
}

.moldura-previa .pequeno { color: var(--branco); padding: 16px; }

.carregando {
  align-self: center;
  width: 84px;
  height: 84px;
  border-radius: 50%;
  border: 10px solid rgba(255,31,142,.25);
  border-top-color: var(--rosa);
  animation: girar .9s linear infinite;
}

@keyframes girar { to { transform: rotate(360deg); } }

@media (prefers-reduced-motion: reduce) {
  .carregando { animation-duration: 3s; }
}
</style>
