<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lúcia 60 anos — Telão</title>
  <link rel="stylesheet" href="/telao/telao.css">
</head>
<body>
  <!-- Tela 16:9 desenhada em 1920 × 1080 e ajustada ao tamanho do projetor. -->
  <div class="tela">
    <!-- Fundo decorativo: artes do convite e da referência do telão (arquivos locais, funcionam sem internet). -->
    <img class="arte lucia lucia-esq" src="/telao/arte/lucia.jpg" alt="" aria-hidden="true">
    <img class="arte lucia lucia-dir" src="/telao/arte/lucia.jpg" alt="" aria-hidden="true">
    <img class="arte guitarra" src="/telao/arte/guitarra.jpg" alt="" aria-hidden="true">
    <img class="arte globo" src="/telao/arte/globo.jpg" alt="" aria-hidden="true">
    <img class="arte titulo" src="/telao/arte/titulo.jpg" alt="Lúcia Calixto — 60 anos — Rock Rosa">
    <img class="arte frase" src="/telao/arte/frase.jpg" alt="Porque 60… é só o começo!">
    <svg class="arte estrela estrela-esq" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6.4 6.9.6-5.2 4.6 1.6 6.8L12 17.3l-6.1 3.6 1.6-6.8-5.2-4.6 6.9-.6z"/></svg>
    <svg class="arte estrela estrela-dir" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.8 6.4 6.9.6-5.2 4.6 1.6 6.8L12 17.3l-6.1 3.6 1.6-6.8-5.2-4.6 6.9-.6z"/></svg>

    <div id="anteriores" class="lateral lateral-esq" aria-label="Fotos anteriores"></div>

    <section class="centro">
      <img id="principal" alt="" class="principal">
      <p id="vazio" class="vazio">Envie a primeira foto pelo celular!</p>
    </section>

    <div id="proximas" class="lateral lateral-dir" aria-label="Próximas fotos"></div>
  </div>

  <script src="/telao/telao.js"></script>
</body>
</html>
