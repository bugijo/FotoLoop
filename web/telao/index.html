<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Lúcia 60 anos — Telão</title>
  <link rel="stylesheet" href="/telao/telao.css">
</head>
<body>
  <header class="faixa" aria-hidden="true">
    <span class="faixa-nome">LÚCIA</span>
    <span class="faixa-anos">60 ANOS</span>
  </header>

  <main class="palco">
    <div id="anteriores" class="lateral" aria-label="Fotos anteriores"></div>

    <section class="centro">
      <div class="quadro">
        <img id="principal" alt="" class="principal">
        <p id="vazio" class="vazio">Envie a primeira foto pelo celular!</p>
      </div>
    </section>

    <div id="proximas" class="lateral" aria-label="Próximas fotos"></div>
  </main>

  <script src="/telao/telao.js"></script>
</body>
</html>
