<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Lúcia 60 anos — Envie sua foto</title>
  <script src="config.js"></script>
  <script>
    // Esta página só redireciona. As fotos são enviadas pelo Apps Script (sem CORS).
    (function () {
      var destino = window.FOTOLOOP_CONFIG && window.FOTOLOOP_CONFIG.paginaApps;
      if (destino) {
        window.location.replace(destino);
      }
    })();
  </script>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
           background: #ff3d9a; color: #1a0a14; text-align: center; padding: 16px; }
    .caixa { background: #fff; border-radius: 16px; padding: 20px; max-width: 420px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <p class="caixa">
    A página de envio ainda não foi configurada. A organização da festa vai avisar o endereço correto.
    <br><br>
    Se você já tem o endereço, <a href="https://script.google.com/">abra o link recebido</a>.
  </p>
</body>
</html>
